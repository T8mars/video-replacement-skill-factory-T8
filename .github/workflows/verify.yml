name: Verify factory publication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/verify_publish.py --revision HEAD
      - run: python -m unittest discover -s tools -p test_publish.py -v
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test_factory.py --work /tmp/factory-regressions
      - run: python scripts/test_runner.py
      - run: python scripts/test_identity.py
